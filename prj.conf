CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_EARLY_CONSOLE=n
CONFIG_SHELL=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
# Logging is off by default. Build with -DEXTRA_CONF_FILE=rtt.conf to get
# logs over SEGGER RTT instead (never UART) as this interferes with operation.
CONFIG_LOG=n

# Protocol UART 
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# USB HID on OTG FS
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y
